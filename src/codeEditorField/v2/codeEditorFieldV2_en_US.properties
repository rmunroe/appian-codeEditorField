# Code Editor Field V2 (Monaco)
name=Code Editor Field V2
description=Monaco-based code editor component with diff/compare support

# Existing parameters
parameter.readOnly.name=Read Only
parameter.readOnly.description=Determines if the field should display as not editable. Default: false.

parameter.marginBelow.name=Margin Below
parameter.marginBelow.description=Determines how much space is added below the layout. Valid values: "NONE", "STANDARD" (default).
parameter.marginBelow.NONE.label=None
parameter.marginBelow.STANDARD.label=Standard

parameter.fontSize.name=Font Size
parameter.fontSize.description=The size of the font in the editor.
parameter.fontSize.12.label=12 px
parameter.fontSize.13.label=13 px
parameter.fontSize.14.label=14 px
parameter.fontSize.16.label=16 px
parameter.fontSize.18.label=18 px
parameter.fontSize.22.label=22 px
parameter.fontSize.24.label=24 px

parameter.hideGutter.name=Hide Gutter
parameter.hideGutter.description=Hides the left gutter section (where line numbers show up).

parameter.hideLineNumbers.name=Hide Line Numbers
parameter.hideLineNumbers.description=Hides the line numbers in the gutter section. Not applicable if gutter is hidden.

parameter.disableCodeFolding.name=Disable Code Folding
parameter.disableCodeFolding.description=Disables the code folding feature. Not applicable if gutter is hidden.

parameter.showPrintMargin.name=Show Print Margin
parameter.showPrintMargin.description=Shows the print margin line.

parameter.printMarginColumn.name=Print Margin Column
parameter.printMarginColumn.description=The column number to show the print margin at (default 80).

parameter.tabSize.name=Tab Size
parameter.tabSize.description=The number of characters for tabs.

parameter.textValue.name=Text Value
parameter.textSaveInto.name=Text Save Into
parameter.text.description=The text value of the code editor (i.e., the code). Used in standard editor mode.

# NEW: Editor Mode parameter
parameter.editorMode.name=Editor Mode
parameter.editorMode.description=The mode of the editor. "editor" for standard editing, "diff" for comparing two versions.
parameter.editorMode.editor.label=Standard Editor
parameter.editorMode.diff.label=Diff/Compare View

# NEW: Diff mode parameters
parameter.originalValue.name=Original Value
parameter.originalValue.description=The original (left side) content for diff comparison. Only used when editorMode is "diff".

parameter.modifiedValueValue.name=Modified Value
parameter.modifiedValueSaveInto.name=Modified Save Into
parameter.modifiedValue.description=The modified (right side) content for diff comparison. Editable when readOnly is false.

parameter.diffViewType.name=Diff View Type
parameter.diffViewType.description=How to display the diff. "sideBySide" shows two editors, "inline" shows changes in a single view.
parameter.diffViewType.sideBySide.label=Side by Side
parameter.diffViewType.inline.label=Inline

